[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-search-downloader"
version = "1.1.2"
description = "Windows GUI and CLI tool for GitHub repository discovery, filtering, metadata export, and bulk download."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Nikita Kizevich" }]
dependencies = ["sv_ttk"]

[project.optional-dependencies]
build = ["build>=1.2", "pyinstaller>=6.0"]

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
